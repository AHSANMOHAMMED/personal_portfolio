# Static GitHub Pages deploy for https://ahsanmohammed.github.io/personal_portfolio/
# /api/chat is excluded from the export (requires Vercel + GROQ_API_KEY for full chat).

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Exclude API route for static export
        run: mv app/api /tmp/portfolio-api

      - name: Build static export
        env:
          GITHUB_PAGES: '1'
          NEXT_PUBLIC_SITE_ORIGIN: https://ahsanmohammed.github.io
          NEXT_PUBLIC_BASE_PATH: /personal_portfolio
        run: npm run build

      - name: Restore API route
        if: always()
        run: |
          if [ -d /tmp/portfolio-api ]; then
            mv /tmp/portfolio-api app/api
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
